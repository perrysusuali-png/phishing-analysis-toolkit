services:
  - type: web
    name: phishing-analysis-toolkit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: TOOLKIT_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
      - key: VT_API_KEY
        sync: false
